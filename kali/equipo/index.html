<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#111111">
  <title>Acceso</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/logo.png">
  <link rel="apple-touch-icon" href="img/logo.png">
  <link rel="stylesheet" href="css/equipo.css">
</head>
<body>
  <main class="login-pagina">
    <div class="login-caja">
      <div class="login-marca">
        <img src="img/logo.png" alt="">
        <h1>Bar Kali Pedregalejo</h1>
        <p>Área de equipo</p>
      </div>
      <form id="formulario" class="tarjeta" novalidate>
        <div id="mensaje" class="aviso-caja error" hidden></div>
        <div class="campo">
          <label for="usuario">Usuario</label>
          <input id="usuario" name="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button id="entrar" class="boton boton-primario" type="submit">Iniciar sesión</button>
      </form>
      <p class="subtitulo" style="text-align:center;margin-top:16px">Si has olvidado tu contraseña, pide al encargado que la restablezca.</p>
    </div>
  </main>
  <script type="module" src="js/login.js"></script>
</body>
</html>
